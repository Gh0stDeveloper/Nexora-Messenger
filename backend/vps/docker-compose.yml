services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - nexora_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../vps-api
    container_name: nexora-relay-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-nexora}
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nexora_uploads:/app/uploads
      - ./secrets:/run/secrets:ro

volumes:
  nexora_postgres:
  nexora_uploads:
