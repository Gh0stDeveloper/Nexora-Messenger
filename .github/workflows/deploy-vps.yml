name: Deploy VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Nexora to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            if [ ! -d /opt/nexora-messenger/.git ]; then
              sudo mkdir -p /opt/nexora-messenger
              sudo chown -R "$USER":"$USER" /opt/nexora-messenger
              git clone https://github.com/Gh0stDeveloper/Nexora-Messenger.git /opt/nexora-messenger
            fi
            cd /opt/nexora-messenger
            git fetch origin main
            git reset --hard origin/main
            cd backend/vps
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "Edit /opt/nexora-messenger/backend/vps/.env before production deploy"
            fi
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
